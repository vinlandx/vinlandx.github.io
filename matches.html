<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0f1a" />
<title>الماتشات - Vinlandx</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-1: #4ade80; --green-2: #22c55e; --green-3: #16a34a; --green-4: #15803d;
  --red-1: #f87171; --red-2: #ef4444; --red-3: #dc2626;
  --gold-1: #fde68a; --gold-2: #fbbf24; --gold-3: #f59e0b; --gold-4: #d97706;
  --blue-2: #60a5fa; --blue-3: #3b82f6;

  --bg: #070b14;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.09);
  --text: #f1f5f9; --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);

  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;

  --grad-green: linear-gradient(135deg, var(--green-1) 0%, var(--green-3) 100%);
  --grad-red: linear-gradient(135deg, var(--red-1) 0%, var(--red-3) 100%);
  --grad-gold: linear-gradient(135deg, var(--gold-2) 0%, var(--gold-4) 100%);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255,255,255,0.9);
  --card-hover: rgba(255,255,255,1);
  --text: #0f172a; --text-muted: #475569;
  --border: rgba(15,23,42,0.08); --border-strong: rgba(15,23,42,0.15);
}

html { scroll-behavior: smooth; }
html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text); background: var(--bg);
  min-height: 100vh; direction: rtl;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

#loader {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 10000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo { width: 100px; height: 100px; margin-bottom: 16px; object-fit: contain; }
.loader-text { font-size: 1.4rem; font-weight: 900; color: var(--green-1); letter-spacing: 2px; margin-bottom: 20px; }
.loader-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
.loader-bar::after { content: ""; position: absolute; inset: 0; background: var(--grad-green); animation: loaderBar 1.2s ease-in-out infinite; }
@keyframes loaderBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background-size: cover; background-position: center;
  background-attachment: fixed;
}
.bg-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(7,11,20,0.8) 0%, rgba(7,11,20,0.95) 100%);
}
[data-theme="light"] .bg-overlay {
  background: linear-gradient(180deg, rgba(248,250,252,0.9) 0%, rgba(248,250,252,0.98) 100%);
}

.glass {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

header {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 1300px; z-index: 100;
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: all 0.3s;
  background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
header.scrolled { top: 6px; padding: 6px 14px; }

.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.header-logo img { height: 40px; width: auto; object-fit: contain; }
.header-logo-text { display: flex; flex-direction: column; line-height: 1; }
.header-logo-text .main { font-size: 1rem; font-weight: 900; color: var(--green-1); letter-spacing: 0.5px; }
.header-logo-text .sub { font-size: 0.62rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 4px; }
nav a {
  padding: 7px 12px; color: var(--text-muted); text-decoration: none;
  font-weight: 700; font-size: 0.82rem; border-radius: var(--radius-sm);
  transition: all 0.2s;
}
nav a:hover { color: var(--text); background: rgba(34,197,94,0.1); }
nav a.active { color: var(--green-1); background: rgba(34,197,94,0.15); }

.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; padding: 0;
}
.icon-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s; font-family: inherit; color: var(--text);
}
.user-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.user-btn img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--green-2); object-fit: cover; }
.user-btn span { font-size: 0.82rem; font-weight: 700; }

.login-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  background: var(--grad-green); border: none; color: #fff;
  font-family: inherit; font-weight: 800; font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}
.login-btn:hover { transform: translateY(-1px); }
.login-btn svg { width: 16px; height: 16px; fill: #fff; }

.mobile-toggle { display: none; }

@media (max-width: 900px) {
  nav {
    display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    flex-direction: column; padding: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  nav.open { display: flex; }
  nav a { width: 100%; text-align: right; padding: 10px 14px; }
  .mobile-toggle { display: flex; }
  .user-btn span { display: none; }
}

main { padding-top: 90px; padding-bottom: 60px; min-height: 100vh; }

.page-header { text-align: center; padding: 30px 0 20px; }
.page-header h1 {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 900;
  margin-bottom: 10px;
}
.page-header h1 .green {
  background: var(--grad-green);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.page-header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

/* FILTERS */
.filters-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  padding: 14px 18px;
}
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip-filter {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  color: var(--text-muted);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}
[data-theme="light"] .chip-filter { background: #fff; }
.chip-filter:hover { border-color: var(--green-2); color: var(--text); }
.chip-filter.active {
  background: var(--grad-green);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}

/* MATCHES LIST */
.matches-list { display: flex; flex-direction: column; gap: 14px; }

.match-card-large {
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s;
}
.match-card-large:hover { transform: translateY(-2px); }
.match-card-large::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--grad-green);
}
.match-card-large.red::before { background: var(--grad-red); }
.match-card-large.gold::before { background: var(--grad-gold); }

.match-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.match-date-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(34,197,94,0.12);
  color: var(--green-1);
  font-size: 0.72rem;
  font-weight: 800;
}
.match-date-badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }

.match-type-badge {
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(251,191,36,0.15);
  color: var(--gold-2);
  font-size: 0.7rem;
  font-weight: 800;
}
.match-type-badge.league { background: rgba(96,165,250,0.15); color: var(--blue-2); }
.match-type-badge.cup { background: rgba(239,68,68,0.15); color: var(--red-1); }
.match-type-badge.champion { background: rgba(251,191,36,0.2); color: var(--gold-2); }

.teams-display {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  margin: 16px 0;
}
.team-side {
  text-align: center;
  padding: 12px;
  border-radius: var(--radius-md);
  transition: all 0.2s;
}
.team-side.winner {
  background: rgba(34,197,94,0.1);
  border: 2px solid rgba(34,197,94,0.3);
}
.team-side.loser {
  opacity: 0.7;
}
.team-logo {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--grad-green);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.3rem;
  font-weight: 900;
  margin: 0 auto 10px;
}
.team-side.winner .team-logo {
  background: var(--grad-gold);
  box-shadow: 0 6px 20px rgba(251,191,36,0.4);
}
.team-name {
  font-size: 0.95rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 4px;
}
.team-side.winner .team-name { color: var(--gold-2); }
.team-status {
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--text-muted);
}
.team-side.winner .team-status { color: var(--green-1); }

.score-display {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 2rem;
  font-weight: 900;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
[data-theme="light"] .score-display { background: rgba(15,23,42,0.05); }

.match-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 700;
  padding: 4px 10px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}
[data-theme="light"] .meta-item { background: rgba(15,23,42,0.04); }
.meta-item svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }

.match-note {
  margin-top: 12px;
  padding: 12px;
  background: rgba(34,197,94,0.06);
  border-right: 3px solid var(--green-2);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 600;
  line-height: 1.6;
}

/* STATS SUMMARY */
.stats-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-mini-card {
  padding: 18px;
  text-align: center;
}
.stat-mini-val {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--green-1);
  line-height: 1;
  margin-bottom: 6px;
}
.stat-mini-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 700;
}

/* EMPTY */
.empty {
  text-align: center;
  padding: 70px 20px;
  color: var(--text-muted);
  font-weight: 600;
}
.empty svg {
  width: 70px;
  height: 70px;
  stroke: var(--green-2);
  fill: none;
  stroke-width: 1.2;
  margin-bottom: 16px;
  opacity: 0.5;
}
.empty h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 6px; }
.empty p { font-size: 0.9rem; }

/* SKELETON */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
  background-size: 200% 100%;
  animation: skeleton 1.5s linear infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  padding: 12px 20px; border-radius: var(--radius-md);
  background: var(--bg); border: 1px solid var(--border-strong);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  font-weight: 700; font-size: 0.85rem; z-index: 500;
  transition: transform 0.3s ease;
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green-2); color: var(--green-1); }
.toast.error { border-color: var(--red-2); color: var(--red-1); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--green-3); border-radius: 999px; }

@media (max-width: 768px) {
  .container { padding: 0 16px; }
  main { padding-top: 80px; }
  .teams-display { grid-template-columns: 1fr auto 1fr; gap: 10px; }
  .team-logo { width: 44px; height: 44px; font-size: 1rem; }
  .team-name { font-size: 0.82rem; }
  .score-display { padding: 8px 14px; font-size: 1.4rem; }
  .match-card-large { padding: 16px; }
  .chip-filter { padding: 6px 12px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<script>
const SUPABASE_URL = "https://dhvuopnibiwpzuwvxxtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sl9It4cgGFwkGCC76X4zHw_Hjx4iELO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let allMatches = [];
let allPlayers = [];
let currentFilter = "all";

window.addEventListener("load", () => {
  document.getElementById("loader").classList.add("hidden");
});

function getSavedTheme() { return localStorage.getItem("vinlandx_theme") || "dark"; }
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("themeIcon");
  if (theme === "dark") {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function toggleTheme() {
  const current = getSavedTheme();
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("vinlandx_theme", next);
  applyTheme(next);
  showToast(next === "dark" ? "🌙 الوضع الداكن" : "☀️ الوضع الفاتح", "success");
}
applyTheme(getSavedTheme());

function toggleMobileNav() { document.getElementById("nav").classList.toggle("open"); }

window.addEventListener("scroll", () => {
  const header = document.getElementById("header");
  if (window.scrollY > 50) header.classList.add("scrolled");
  else header.classList.remove("scrolled");
});

// AUTH
async function signInWithGoogle() {
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://vinlandx.github.io" }
    });
    if (error) throw error;
  } catch (err) {
    showToast("خطأ: " + err.message, "error");
  }
}

async function signOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  renderUserArea();
}

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  }
  renderUserArea();
}

supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  } else {
    currentUser = null;
    currentProfile = null;
  }
  renderUserArea();
});

function renderUserArea() {
  const area = document.getElementById("userArea");
  if (currentUser) {
    const avatar = currentProfile?.avatar_url ||
      currentUser?.user_metadata?.avatar_url ||
      currentUser?.user_metadata?.picture ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.email)}&background=22c55e&color=fff`;
    const name = currentProfile?.full_name || currentUser?.user_metadata?.full_name || currentUser.email;
    area.innerHTML = `
      <button class="user-btn" onclick="if(confirm('تسجّل الخروج؟')) signOut()">
        <img src="${avatar}" alt="${escapeHTML(name)}" />
        <span>${escapeHTML(name.split("@")[0])}</span>
      </button>
    `;
  } else {
    area.innerHTML = `
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    `;
  }
}

function escapeHTML(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const months = ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان", "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

async function fetchSafe(table, query = "") {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

let toastTimer;
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  clearTimeout(toastTimer);
  setTimeout(() => t.classList.add("show"), 10);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

// FILTER
function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll(".chip-filter").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderMatches();
}

// LOAD
async function loadAll() {
  try {
    const [matches, players] = await Promise.all([
      fetchSafe("matches", "select=*&order=match_date.desc"),
      fetchSafe("players", "select=id,name,photo,position")
    ]);
    allMatches = matches;
    allPlayers = players;
    renderStatsSummary();
    renderMatches();
    setupRealtime();
  } catch (e) {
    console.error(e);
    document.getElementById("matchesList").innerHTML = '<div class="empty"><h3>خطأ في التحميل</h3></div>';
  }
}

function renderStatsSummary() {
  const el = document.getElementById("statsSummary");
  if (!el) return;

  const totalMatches = allMatches.length;
  let totalGoals = 0;
  let biggestWin = null;
  let biggestDiff = 0;

  allMatches.forEach(m => {
    totalGoals += (m.score_a || 0) + (m.score_b || 0);
    const diff = Math.abs((m.score_a || 0) - (m.score_b || 0));
    if (diff > biggestDiff) {
      biggestDiff = diff;
      biggestWin = m;
    }
  });

  const avgGoals = totalMatches > 0 ? (totalGoals / totalMatches).toFixed(1) : "0";

  el.innerHTML = `
    <div class="stat-mini-card glass">
      <div class="stat-mini-val">${totalMatches}</div>
      <div class="stat-mini-label">مجموع الماتشات</div>
    </div>
    <div class="stat-mini-card glass">
      <div class="stat-mini-val">${totalGoals}</div>
      <div class="stat-mini-label">مجموع الأهداف</div>
    </div>
    <div class="stat-mini-card glass">
      <div class="stat-mini-val">${avgGoals}</div>
      <div class="stat-mini-label">معدل الأهداف/ماتش</div>
    </div>
    <div class="stat-mini-card glass">
      <div class="stat-mini-val">${biggestDiff}</div>
      <div class="stat-mini-label">أكبر فارق</div>
    </div>
  `;
}

function renderMatches() {
  const list = document.getElementById("matchesList");
  let filtered = allMatches;

  if (currentFilter !== "all") {
    filtered = filtered.filter(m => (m.match_type || "friendly") === currentFilter);
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
        <h3>ما فيه ماتشات</h3>
        <p>الماتشات راح تظهر هنا</p>
      </div>
    `;
    return;
  }

  const typeLabels = {
    friendly: "ودّي",
    league: "دوري",
    cup: "كأس",
    champion: "شامبيون"
  };

  list.innerHTML = filtered.map(m => {
    const aWon = m.score_a > m.score_b;
    const bWon = m.score_b > m.score_a;
    const draw = m.score_a === m.score_b;
    const type = m.match_type || "friendly";
    const typeLabel = typeLabels[type] || "ودّي";
    const typeClass = type === "league" ? "league" : type === "cup" ? "cup" : type === "champion" ? "champion" : "";

    return `
      <div class="match-card-large glass ${type === "cup" ? "red" : type === "champion" ? "gold" : ""}">
        <div class="match-header">
          <div class="match-date-badge">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${formatDate(m.match_date)}
          </div>
          <div class="match-type-badge ${typeClass}">${typeLabel}</div>
        </div>

        <div class="teams-display">
          <div class="team-side ${aWon ? 'winner' : ''} ${bWon ? 'loser' : ''}">
            <div class="team-logo">${(m.team_a || "A").charAt(0)}</div>
            <div class="team-name">${escapeHTML(m.team_a || "فريق أ")}</div>
            <div class="team-status">${aWon ? "🏆 فائز" : bWon ? "خاسر" : draw ? "تعادل" : ""}</div>
          </div>

          <div class="score-display">
            <span>${m.score_a ?? 0}</span>
            <span style="color: var(--text-muted); font-size: 1rem;">-</span>
            <span>${m.score_b ?? 0}</span>
          </div>

          <div class="team-side ${bWon ? 'winner' : ''} ${aWon ? 'loser' : ''}">
            <div class="team-logo">${(m.team_b || "B").charAt(0)}</div>
            <div class="team-name">${escapeHTML(m.team_b || "فريق ب")}</div>
            <div class="team-status">${bWon ? "🏆 فائز" : aWon ? "خاسر" : draw ? "تعادل" : ""}</div>
          </div>
        </div>

        ${(m.location || m.competition) ? `
          <div class="match-meta">
            ${m.location ? `
              <div class="meta-item">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${escapeHTML(m.location)}
              </div>
            ` : ''}
            ${m.competition ? `
              <div class="meta-item">
                <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                ${escapeHTML(m.competition)}
              </div>
            ` : ''}
          </div>
        ` : ''}

        ${m.notes ? `<div class="match-note">📝 ${escapeHTML(m.notes)}</div>` : ''}
      </div>
    `;
  }).join("");
}

function setupRealtime() {
  supabaseClient
    .channel("vinlandx-matches")
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, () => loadAll())
    .subscribe();
}

document.addEventListener("DOMContentLoaded", async () => {
  await checkAuth();
  await loadAll();
});
</script>
