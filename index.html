<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0f1a" />
<title>كرة الحومة - Vinlandx</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-1: #4ade80; --green-2: #22c55e; --green-3: #16a34a; --green-4: #15803d;
  --red-1: #f87171; --red-2: #ef4444; --red-3: #dc2626;
  --gold-1: #fde68a; --gold-2: #fbbf24; --gold-3: #f59e0b; --gold-4: #d97706;
  --blue-2: #60a5fa; --blue-3: #3b82f6;

  --bg: #070b14;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.09);
  --text: #f1f5f9; --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);

  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;

  --grad-green: linear-gradient(135deg, var(--green-1) 0%, var(--green-3) 100%);
  --grad-red: linear-gradient(135deg, var(--red-1) 0%, var(--red-3) 100%);
  --grad-gold: linear-gradient(135deg, var(--gold-2) 0%, var(--gold-4) 100%);
  --grad-mixed: linear-gradient(135deg, var(--green-2) 0%, var(--gold-2) 50%, var(--red-2) 100%);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255,255,255,0.9);
  --card-hover: rgba(255,255,255,1);
  --text: #0f172a; --text-muted: #475569;
  --border: rgba(15,23,42,0.08); --border-strong: rgba(15,23,42,0.15);
}

html { scroll-behavior: smooth; }
html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text); background: var(--bg);
  min-height: 100vh; direction: rtl;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ===== LOADER (مبسط و خفيف) ===== */
#loader {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 10000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo {
  width: 100px; height: 100px; margin-bottom: 16px;
  object-fit: contain;
}
.loader-text {
  font-size: 1.4rem; font-weight: 900;
  color: var(--green-1);
  letter-spacing: 2px;
  margin-bottom: 20px;
}
.loader-bar {
  width: 160px; height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px; overflow: hidden; position: relative;
}
.loader-bar::after {
  content: ""; position: absolute; inset: 0;
  background: var(--grad-green);
  animation: loaderBar 1.2s ease-in-out infinite;
}
@keyframes loaderBar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ===== BACKGROUND (مبسط) ===== */
.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background-size: cover; background-position: center;
  background-attachment: fixed;
}
.bg-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(7,11,20,0.8) 0%, rgba(7,11,20,0.95) 100%);
}
[data-theme="light"] .bg-overlay {
  background: linear-gradient(180deg, rgba(248,250,252,0.9) 0%, rgba(248,250,252,0.98) 100%);
}

/* ===== GLASS ===== */
.glass {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.container { max-width: 1300px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* ===== HEADER ===== */
header {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 1300px; z-index: 100;
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: all 0.3s;
  background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
header.scrolled { top: 6px; padding: 6px 14px; }

.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.header-logo img { height: 40px; width: auto; object-fit: contain; }
.header-logo-text { display: flex; flex-direction: column; line-height: 1; }
.header-logo-text .main {
  font-size: 1rem; font-weight: 900;
  color: var(--green-1);
  letter-spacing: 0.5px;
}
.header-logo-text .sub { font-size: 0.62rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 4px; }
nav a {
  padding: 7px 12px; color: var(--text-muted); text-decoration: none;
  font-weight: 700; font-size: 0.82rem; border-radius: var(--radius-sm);
  transition: all 0.2s;
}
nav a:hover { color: var(--text); background: rgba(34,197,94,0.1); }
nav a.active { color: var(--green-1); background: rgba(34,197,94,0.15); }

.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; padding: 0;
}
.icon-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s; font-family: inherit; color: var(--text);
}
.user-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.user-btn img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--green-2); object-fit: cover; }
.user-btn span { font-size: 0.82rem; font-weight: 700; }

.login-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  background: var(--grad-green); border: none; color: #fff;
  font-family: inherit; font-weight: 800; font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}
.login-btn:hover { transform: translateY(-1px); }
.login-btn svg { width: 16px; height: 16px; fill: #fff; }

.mobile-toggle { display: none; }

@media (max-width: 900px) {
  nav {
    display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    flex-direction: column; padding: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  nav.open { display: flex; }
  nav a { width: 100%; text-align: right; padding: 10px 14px; }
  .mobile-toggle { display: flex; }
  .user-btn span { display: none; }
}

main { padding-top: 90px; padding-bottom: 60px; min-height: 100vh; }

/* ===== STATS ===== */
.stats-section { margin: 20px 0 40px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat-card {
  padding: 22px 16px; text-align: center;
  transition: transform 0.2s, background 0.2s;
  cursor: pointer;
}
.stat-card:hover { transform: translateY(-4px); background: var(--card-hover); }
.stat-icon {
  width: 48px; height: 48px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
}
.stat-icon svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.stat-icon.green { background: var(--grad-green); }
.stat-icon.red { background: var(--grad-red); }
.stat-icon.gold { background: var(--grad-gold); }
.stat-icon.blue { background: linear-gradient(135deg, var(--blue-2), var(--blue-3)); }

.stat-value {
  font-size: 2rem; font-weight: 900; line-height: 1; margin-bottom: 6px;
  color: var(--text);
}
.stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }

/* ===== SECTION ===== */
section { margin: 40px 0; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.section-title { font-size: 1.3rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
.section-title .icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--grad-green);
  display: flex; align-items: center; justify-content: center;
}
.section-title .icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.section-title .icon.red { background: var(--grad-red); }

.section-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--green-1); text-decoration: none; font-weight: 800; font-size: 0.82rem;
  transition: gap 0.2s;
}
.section-link:hover { gap: 10px; }
.section-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; }

/* ===== PLAYERS ===== */
.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

.fifa-card {
  position: relative; border-radius: 16px; padding: 18px;
  text-align: center; overflow: hidden; cursor: pointer;
  transition: transform 0.3s ease;
}
.fifa-card.gold {
  background: linear-gradient(160deg, #fef9c3 0%, #fde68a 20%, #fbbf24 50%, #d97706 85%, #92400e 100%);
  box-shadow: 0 10px 30px rgba(217,119,6,0.3);
}
.fifa-card.silver {
  background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 55%, #94a3b8 85%, #64748b 100%);
  box-shadow: 0 10px 30px rgba(100,116,139,0.3);
}
.fifa-card.bronze {
  background: linear-gradient(160deg, #fed7aa 0%, #fb923c 25%, #ea580c 55%, #c2410c 85%, #7c2d12 100%);
  box-shadow: 0 10px 30px rgba(194,65,12,0.3);
}
.fifa-card:hover { transform: translateY(-6px); }

.fifa-rating {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-bottom: 12px;
}
.fifa-rating-num {
  font-size: 2.2rem; font-weight: 900; line-height: 1;
  color: #422006;
}
.fifa-card.silver .fifa-rating-num { color: #1e293b; }
.fifa-card.bronze .fifa-rating-num { color: #431407; }

.fifa-position {
  padding: 3px 8px; border-radius: 6px;
  font-size: 0.65rem; font-weight: 900; letter-spacing: 1px;
  background: rgba(66,32,6,0.9); color: #fef3c7;
}
.fifa-card.silver .fifa-position { background: rgba(30,41,59,0.9); color: #f1f5f9; }
.fifa-card.bronze .fifa-position { background: rgba(67,20,7,0.9); color: #fed7aa; }

.fifa-photo-wrap { width: 80px; height: 80px; margin: 0 auto 12px; }
.fifa-photo {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  border: 3px solid rgba(255,255,255,0.9);
  background: #f1f5f9;
}
.fifa-name {
  font-size: 1rem; font-weight: 900; margin-bottom: 10px;
  color: #422006;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fifa-card.silver .fifa-name { color: #1e293b; }
.fifa-card.bronze .fifa-name { color: #431407; }

.fifa-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px 12px; padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.15);
}
.fifa-stat {
  display: flex; align-items: baseline; gap: 4px;
  font-size: 0.65rem; font-weight: 800;
  color: #422006;
}
.fifa-card.silver .fifa-stat { color: #1e293b; }
.fifa-card.bronze .fifa-stat { color: #431407; }
.fifa-stat-val { font-size: 0.9rem; font-weight: 900; }

/* ===== MATCHES ===== */
.matches-grid { display: grid; gap: 10px; }
.match-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; transition: transform 0.2s; gap: 12px; cursor: pointer;
}
.match-card:hover { transform: translateX(-3px); }
.match-team { flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 0.9rem; }
.match-team.right { justify-content: flex-end; text-align: left; }
.match-team-avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--grad-green);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 0.8rem; flex-shrink: 0;
}
.match-team-avatar.winner { background: var(--grad-gold); }
.match-score {
  padding: 6px 14px; border-radius: var(--radius-sm);
  background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
  color: var(--green-1); font-weight: 900; font-size: 0.95rem;
  min-width: 65px; text-align: center;
}
.match-date { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-align: center; width: 100%; margin-top: 3px; }

/* ===== EMPTY / SKELETON ===== */
.empty { text-align: center; padding: 50px 20px; color: var(--text-muted); font-weight: 600; }
.empty svg { width: 56px; height: 56px; stroke: var(--green-2); fill: none; stroke-width: 1.5; margin-bottom: 12px; opacity: 0.5; }
.empty h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; }
.empty p { font-size: 0.82rem; }

.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
  background-size: 200% 100%;
  animation: skeleton 1.5s linear infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-card { height: 240px; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  padding: 12px 20px; border-radius: var(--radius-md);
  background: var(--bg); border: 1px solid var(--border-strong);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  font-weight: 700; font-size: 0.85rem; z-index: 500;
  transition: transform 0.3s ease;
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green-2); color: var(--green-1); }
.toast.error { border-color: var(--red-2); color: var(--red-1); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--green-3); border-radius: 999px; }

@media (max-width: 768px) {
  .container { padding: 0 16px; }
  main { padding-top: 80px; }
  .section-title { font-size: 1.1rem; }
  .section-title .icon { width: 30px; height: 30px; }
  .section-title .icon svg { width: 16px; height: 16px; }
  .stat-value { font-size: 1.6rem; }
  .players-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .fifa-card { padding: 14px; }
  .fifa-rating-num { font-size: 1.7rem; }
  .fifa-photo-wrap { width: 70px; height: 70px; }
  .match-card { padding: 10px 12px; }
  .match-team { font-size: 0.8rem; }
  .match-score { padding: 5px 10px; font-size: 0.85rem; min-width: 55px; }
}

@media (max-width: 480px) {
  .players-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 16px 10px; }
  .stat-icon { width: 40px; height: 40px; }
  .stat-icon svg { width: 20px; height: 20px; }
  .stat-value { font-size: 1.4rem; }
  .header-logo img { height: 32px; }
  .header-logo-text .main { font-size: 0.9rem; }
}
</style>
</head>

</header>

        <div class="stat-card glass skeleton"></div>
      </div>

    <section>
      <div class="section-header">
        <h2 class="section-title">
          <span class="icon">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>

        <div class="skeleton skeleton-card"></div>

</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://dhvuopnibiwpzuwvxxtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sl9It4cgGFwkGCC76X4zHw_Hjx4iELO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let allPlayers = [];
let allMatches = [];
let allEvents = [];

// ===== LOADER — يختفي بسرعة =====
window.addEventListener("load", () => {
  document.getElementById("loader").classList.add("hidden");
});

// ===== THEME =====
function getSavedTheme() { return localStorage.getItem("vinlandx_theme") || "dark"; }
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("themeIcon");
  if (theme === "dark") {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function toggleTheme() {
  const current = getSavedTheme();
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("vinlandx_theme", next);
  applyTheme(next);
  showToast(next === "dark" ? "🌙 الوضع الداكن" : "☀️ الوضع الفاتح", "success");
}
applyTheme(getSavedTheme());

function toggleMobileNav() { document.getElementById("nav").classList.toggle("open"); }

window.addEventListener("scroll", () => {
  const header = document.getElementById("header");
  if (window.scrollY > 50) header.classList.add("scrolled");
  else header.classList.remove("scrolled");
});

// ===== AUTH =====
async function signInWithGoogle() {
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://vinlandx.github.io" }
    });
    if (error) throw error;
  } catch (err) {
    showToast("خطأ: " + err.message, "error");
  }
}

async function signOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  renderUserArea();
  showToast("تسجّل الخروج", "success");
}

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  }
  renderUserArea();
}

supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  } else {
    currentUser = null;
    currentProfile = null;
  }
  renderUserArea();
});

function renderUserArea() {
  const area = document.getElementById("userArea");
  if (currentUser) {
    // ===== Avatar من Google أو Supabase =====
    const avatar = 
      currentProfile?.avatar_url || 
      currentUser?.user_metadata?.avatar_url || 
      currentUser?.user_metadata?.picture || 
      `https://ui-avatars.com/api/?name=${encodeURIComponent(currentProfile?.full_name || currentUser?.email || "لاعب")}&background=22c55e&color=fff&bold=true`;
    
    const name = 
      currentProfile?.full_name || 
      currentUser?.user_metadata?.full_name || 
      currentUser?.user_metadata?.name || 
      currentUser?.email?.split("@")[0] || 
      "لاعب";

    area.innerHTML = `
      <button class="user-btn" onclick="if(confirm('تسجّل الخروج؟')) signOut()" title="${escapeHTML(name)}">
        <img src="${avatar}" alt="${escapeHTML(name)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=22c55e&color=fff'" />
        <span>${escapeHTML(name)}</span>
      </button>
    `;
  } else {
    area.innerHTML = `
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    `;
  }
}

// ===== HELPERS =====
function escapeHTML(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}
function getCardTier(o) {
  if (o >= 85) return "gold";
  if (o >= 70) return "silver";
  return "bronze";
}
function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23334"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="%2322c55e" stroke-width="1.5"/></svg>';
}
function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const months = ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان", "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
async function fetchSafe(table, query = "") {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

let toastTimer;
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  clearTimeout(toastTimer);
  setTimeout(() => t.classList.add("show"), 10);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

async function loadAll() {
  try {
    const [players, matches, events] = await Promise.all([
      fetchSafe("players", "select=*&order=created_at.desc"),
      fetchSafe("matches", "select=*&order=match_date.desc&limit=3"),
      fetchSafe("events", "select=event_type")
    ]);
    allPlayers = players;
    allMatches = matches;
    allEvents = events;
    renderStats();
    renderPlayers();
    renderMatches();
    setupRealtime();
  } catch (e) { console.error(e); }
}

function renderStats() {
  const totalPlayers = allPlayers.length;
  const totalGoals = allEvents.filter(e => e.event_type === "goal").length;
  const totalAssists = allEvents.filter(e => e.event_type === "assist").length;
  const totalMatches = allMatches.length;
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card glass">
      <div class="stat-icon green"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div class="stat-value">${totalPlayers}</div>
      <div class="stat-label">لاعب مسجّل</div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon red"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg></div>
      <div class="stat-value">${totalGoals}</div>
      <div class="stat-label">هدف مسجّل</div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon gold"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div class="stat-value">${totalAssists}</div>
      <div class="stat-label">تمريرة حاسمة</div>
    </div>
    <div class="stat-card glass">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="stat-value">${totalMatches}</div>
      <div class="stat-label">ماتش مسجّل</div>
    </div>
  `;
}

function renderPlayers() {
  const grid = document.getElementById("playersGrid");
  if (allPlayers.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column: 1 / -1;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        <h3>ما فيه لاعبين بعد</h3>
        <p>الأدمن يزيد اللاعبين من اللوحة</p>
      </div>
    `;
    return;
  }
  const sorted = [...allPlayers].sort((a, b) => calcOverall(b) - calcOverall(a)).slice(0, 4);
  grid.innerHTML = sorted.map(p => {
    const overall = calcOverall(p);
    const tier = getCardTier(overall);
    const photo = p.photo || defaultPhoto();
    return `
      <div class="fifa-card ${tier}" onclick="location.href='player.html?id=${p.id}'">
        <div class="fifa-rating">
          <span class="fifa-rating-num">${overall}</span>
          <span class="fifa-position">${p.position}</span>
        </div>
        <div class="fifa-photo-wrap">
          <img class="fifa-photo" src="${photo}" alt="${escapeHTML(p.name)}" onerror="this.src='${defaultPhoto()}'" />
        </div>
        <div class="fifa-name">${escapeHTML(p.name)}</div>
        <div class="fifa-stats">
          <div class="fifa-stat"><span class="fifa-stat-val">${p.pace||0}</span> سرعة</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.shot_power||0}</span> فراب</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.passing||0}</span> تمرير</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.dribbling||0}</span> مراوغة</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.defense||0}</span> دفاع</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.strength||0}</span> قوة</div>
        </div>
      </div>
    `;
  }).join("");
}

function renderMatches() {
  const grid = document.getElementById("matchesGrid");
  if (allMatches.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
        <h3>ما فيه ماتشات</h3>
        <p>الماتشات راح تظهر هنا</p>
      </div>
    `;
    return;
  }
  grid.innerHTML = allMatches.map(m => {
    const aWon = m.score_a > m.score_b;
    const bWon = m.score_b > m.score_a;
    return `
      <div class="match-card glass" onclick="location.href='matches.html'">
        <div class="match-team">
          <div class="match-team-avatar ${aWon ? 'winner' : ''}">${(m.team_a||'A').charAt(0)}</div>
          <span>${escapeHTML(m.team_a)}</span>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div class="match-score">${m.score_a} - ${m.score_b}</div>
          <div class="match-date">${formatDate(m.match_date)}</div>
        </div>
        <div class="match-team right">
          <span>${escapeHTML(m.team_b)}</span>
          <div class="match-team-avatar ${bWon ? 'winner' : ''}">${(m.team_b||'B').charAt(0)}</div>
        </div>
      </div>
    `;
  }).join("");
}

function setupRealtime() {
  supabaseClient
    .channel("vinlandx-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, () => loadAll())
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, () => loadAll())
    .on("postgres_changes", { event: "*", schema: "public", table: "events" }, () => loadAll())
    .subscribe();
}

document.addEventListener("DOMContentLoaded", async () => {
  await checkAuth();
  await loadAll();
});
</script>

</body>
</html>
