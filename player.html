<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0f1a" />
<title>بطاقة اللاعب - Vinlandx</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="manifest" href="manifest.json" />
  <script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-1: #4ade80; --green-2: #22c55e; --green-3: #16a34a; --green-4: #15803d;
  --red-1: #f87171; --red-2: #ef4444; --red-3: #dc2626;
  --gold-1: #fde68a; --gold-2: #fbbf24; --gold-3: #f59e0b; --gold-4: #d97706;
  --blue-2: #60a5fa; --blue-3: #3b82f6;

  --bg: #070b14;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.09);
  --text: #f1f5f9; --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);

  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;

  --grad-green: linear-gradient(135deg, var(--green-1) 0%, var(--green-3) 100%);
  --grad-red: linear-gradient(135deg, var(--red-1) 0%, var(--red-3) 100%);
  --grad-gold: linear-gradient(135deg, var(--gold-2) 0%, var(--gold-4) 100%);
  --grad-mixed: linear-gradient(135deg, var(--green-2) 0%, var(--gold-2) 50%, var(--red-2) 100%);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255,255,255,0.9);
  --card-hover: rgba(255,255,255,1);
  --text: #0f172a; --text-muted: #475569;
  --border: rgba(15,23,42,0.08); --border-strong: rgba(15,23,42,0.15);
}

html { scroll-behavior: smooth; }
html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text); background: var(--bg);
  min-height: 100vh; direction: rtl;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

/* LOADER */
#loader {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 10000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo { width: 100px; height: 100px; margin-bottom: 16px; object-fit: contain; }
.loader-text { font-size: 1.4rem; font-weight: 900; color: var(--green-1); letter-spacing: 2px; margin-bottom: 20px; }
.loader-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
.loader-bar::after { content: ""; position: absolute; inset: 0; background: var(--grad-green); animation: loaderBar 1.2s ease-in-out infinite; }
@keyframes loaderBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* BACKGROUND */
.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background-size: cover; background-position: center;
  background-attachment: fixed;
}
.bg-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(7,11,20,0.8) 0%, rgba(7,11,20,0.95) 100%);
}
[data-theme="light"] .bg-overlay {
  background: linear-gradient(180deg, rgba(248,250,252,0.9) 0%, rgba(248,250,252,0.98) 100%);
}

.glass {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* HEADER */
header {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 1300px; z-index: 100;
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: all 0.3s;
  background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
header.scrolled { top: 6px; padding: 6px 14px; }

.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.header-logo img { height: 40px; width: auto; object-fit: contain; }
.header-logo-text { display: flex; flex-direction: column; line-height: 1; }
.header-logo-text .main { font-size: 1rem; font-weight: 900; color: var(--green-1); letter-spacing: 0.5px; }
.header-logo-text .sub { font-size: 0.62rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 4px; }
nav a {
  padding: 7px 12px; color: var(--text-muted); text-decoration: none;
  font-weight: 700; font-size: 0.82rem; border-radius: var(--radius-sm);
  transition: all 0.2s;
}
nav a:hover { color: var(--text); background: rgba(34,197,94,0.1); }
nav a.active { color: var(--green-1); background: rgba(34,197,94,0.15); }

.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; padding: 0;
}
.icon-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s; font-family: inherit; color: var(--text);
}
.user-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.user-btn img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--green-2); object-fit: cover; }
.user-btn span { font-size: 0.82rem; font-weight: 700; }

.login-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  background: var(--grad-green); border: none; color: #fff;
  font-family: inherit; font-weight: 800; font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}
.login-btn:hover { transform: translateY(-1px); }
.login-btn svg { width: 16px; height: 16px; fill: #fff; }

.mobile-toggle { display: none; }

@media (max-width: 900px) {
  nav {
    display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    flex-direction: column; padding: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  nav.open { display: flex; }
  nav a { width: 100%; text-align: right; padding: 10px 14px; }
  .mobile-toggle { display: flex; }
  .user-btn span { display: none; }
}

main { padding-top: 100px; padding-bottom: 60px; min-height: 100vh; }

/* ===== PLAYER SCENE ===== */
.player-scene {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 40px;
  align-items: start;
  margin-bottom: 40px;
}
@media (max-width: 900px) {
  .player-scene { grid-template-columns: 1fr; gap: 24px; }
}

/* ===== BIG FIFA CARD ===== */
.big-fifa-card {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  border-radius: 28px;
  padding: 32px 28px;
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.6s cubic-bezier(.4,0,.2,1);
  transform-style: preserve-3d;
  perspective: 1200px;
}
.big-fifa-card.gold {
  background: linear-gradient(160deg, #fef9c3 0%, #fde68a 20%, #fbbf24 50%, #d97706 85%, #92400e 100%);
  box-shadow: 0 30px 80px rgba(217,119,6,0.5), inset 0 0 0 3px rgba(255,255,255,0.5);
}
.big-fifa-card.silver {
  background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 55%, #94a3b8 85%, #64748b 100%);
  box-shadow: 0 30px 80px rgba(100,116,139,0.5), inset 0 0 0 3px rgba(255,255,255,0.6);
}
.big-fifa-card.bronze {
  background: linear-gradient(160deg, #fed7aa 0%, #fb923c 25%, #ea580c 55%, #c2410c 85%, #7c2d12 100%);
  box-shadow: 0 30px 80px rgba(194,65,12,0.5), inset 0 0 0 3px rgba(255,255,255,0.4);
}
.big-fifa-card::before {
  content: "";
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.9s;
  pointer-events: none;
}
.big-fifa-card:hover::before { transform: translateX(100%); }
.big-fifa-card:hover { transform: translateY(-12px) rotateY(6deg) rotateX(-4deg) scale(1.02); }

.big-fifa-rating {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 20px;
  position: relative; z-index: 1;
}
.big-fifa-rating-num {
  font-size: 4rem; font-weight: 900; line-height: 1;
  color: #422006; text-shadow: 0 3px 6px rgba(255,255,255,0.5);
}
.big-fifa-card.silver .big-fifa-rating-num { color: #1e293b; text-shadow: 0 3px 6px rgba(255,255,255,0.7); }
.big-fifa-card.bronze .big-fifa-rating-num { color: #431407; text-shadow: 0 3px 6px rgba(255,255,255,0.3); }

.big-fifa-position {
  padding: 6px 14px; border-radius: 10px;
  font-size: 0.85rem; font-weight: 900; letter-spacing: 1.5px;
  background: rgba(66,32,6,0.9); color: #fef3c7;
}
.big-fifa-card.silver .big-fifa-position { background: rgba(30,41,59,0.9); color: #f1f5f9; }
.big-fifa-card.bronze .big-fifa-position { background: rgba(67,20,7,0.9); color: #fed7aa; }

.big-fifa-photo-wrap {
  width: 160px; height: 160px;
  margin: 0 auto 20px;
  position: relative; z-index: 1;
}
.big-fifa-photo {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover;
  border: 5px solid rgba(255,255,255,0.9);
  box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  background: #f1f5f9;
}
.big-fifa-photo-wrap::after {
  content: "";
  position: absolute; inset: -12px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.5), transparent 70%);
  z-index: -1;
  animation: pulseGlow 2.5s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%,100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.1); }
}
.big-fifa-name {
  font-size: 1.8rem; font-weight: 900; margin-bottom: 20px;
  color: #422006; text-shadow: 0 3px 6px rgba(255,255,255,0.5);
  position: relative; z-index: 1;
}
.big-fifa-card.silver .big-fifa-name { color: #1e293b; }
.big-fifa-card.bronze .big-fifa-name { color: #431407; }

.big-fifa-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px 24px; padding-top: 20px;
  border-top: 2px solid rgba(0,0,0,0.15);
  position: relative; z-index: 1;
}
.big-fifa-stat {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; font-size: 0.85rem; font-weight: 800;
  color: #422006;
}
.big-fifa-card.silver .big-fifa-stat { color: #1e293b; }
.big-fifa-card.bronze .big-fifa-stat { color: #431407; }
.big-fifa-stat-label { font-size: 0.75rem; opacity: 0.8; }
.big-fifa-stat-val { font-size: 1.2rem; font-weight: 900; }

/* ===== PLAYER INFO ===== */
.player-info-section { padding: 28px; }

.player-name-header {
  font-size: 2rem;
  font-weight: 900;
  margin-bottom: 8px;
  color: var(--text);
}
.player-name-header .green {
  background: var(--grad-green);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.player-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.meta-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 0.78rem;
}
.meta-tag.green { background: rgba(34,197,94,0.15); color: var(--green-1); border: 1px solid rgba(34,197,94,0.3); }
.meta-tag.gold { background: rgba(251,191,36,0.15); color: var(--gold-2); border: 1px solid rgba(251,191,36,0.3); }
.meta-tag.red { background: rgba(239,68,68,0.15); color: var(--red-1); border: 1px solid rgba(239,68,68,0.3); }
.meta-tag.blue { background: rgba(96,165,250,0.15); color: var(--blue-2); border: 1px solid rgba(96,165,250,0.3); }

.meta-tag svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; }

/* Stats grid */
.detailed-stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-box {
  padding: 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  text-align: center;
  transition: all 0.2s;
}
[data-theme="light"] .stat-box { background: rgba(15,23,42,0.03); }
.stat-box:hover {
  background: rgba(34,197,94,0.08);
  border-color: var(--green-3);
  transform: translateY(-2px);
}
.stat-box-val {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 4px;
  color: var(--green-1);
}
.stat-box-lbl {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 700;
}

/* Progress bars */
.stats-bars { margin-bottom: 24px; }
.stat-bar-row {
  margin-bottom: 16px;
}
.stat-bar-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.85rem;
  font-weight: 800;
}
.stat-bar-header-label { color: var(--text); }
.stat-bar-header-val { color: var(--green-1); }
.stat-bar-bg {
  height: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
[data-theme="light"] .stat-bar-bg { background: rgba(15,23,42,0.1); }
.stat-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 1s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
.stat-bar-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: barShine 2s linear infinite;
}
@keyframes barShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.stat-bar-fill.green { background: var(--grad-green); }
.stat-bar-fill.gold { background: var(--grad-gold); }
.stat-bar-fill.red { background: var(--grad-red); }
.stat-bar-fill.blue { background: linear-gradient(135deg, var(--blue-2), var(--blue-3)); }

/* Achievements */
.achievements-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.achievement-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(217,119,6,0.15));
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 0.8rem;
  color: var(--gold-2);
}
.achievement-badge svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
}

/* Actions */
.player-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-weight: 800;
  font-size: 0.85rem;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
}
.action-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.action-btn.green {
  background: var(--grad-green);
  color: #fff;
  box-shadow: 0 4px 16px rgba(34,197,94,0.3);
}
.action-btn.green:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(34,197,94,0.5);
}
.action-btn.gold {
  background: var(--grad-gold);
  color: #fff;
  box-shadow: 0 4px 16px rgba(251,191,36,0.3);
}
.action-btn.gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(251,191,36,0.5);
}
.action-btn.whatsapp {
  background: linear-gradient(135deg, #25d366, #128c7e);
  color: #fff;
  box-shadow: 0 4px 16px rgba(37,211,102,0.3);
}
.action-btn.whatsapp:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37,211,102,0.5);
}
.action-btn.outline {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-strong);
  color: var(--text);
}
.action-btn.outline:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--green-2);
}

/* Empty / Loading */
.empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
  font-weight: 600;
}
.empty svg {
  width: 80px;
  height: 80px;
  stroke: var(--green-2);
  fill: none;
  stroke-width: 1.2;
  margin-bottom: 20px;
  opacity: 0.5;
}
.empty h2 {
  font-size: 1.4rem;
  color: var(--text);
  margin-bottom: 10px;
}
.empty p { margin-bottom: 24px; }
.empty .action-btn { display: inline-flex; }

.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
  background-size: 200% 100%;
  animation: skeleton 1.5s linear infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  padding: 12px 20px;
  border-radius: var(--radius-md);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  font-weight: 700;
  font-size: 0.85rem;
  z-index: 500;
  transition: transform 0.3s ease;
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green-2); color: var(--green-1); }
.toast.error { border-color: var(--red-2); color: var(--red-1); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--green-3); border-radius: 999px; }

@media (max-width: 768px) {
  .container { padding: 0 16px; }
  main { padding-top: 90px; }
  .big-fifa-rating-num { font-size: 3rem; }
  .big-fifa-photo-wrap { width: 130px; height: 130px; }
  .big-fifa-name { font-size: 1.5rem; }
  .player-name-header { font-size: 1.5rem; }
  .player-info-section { padding: 20px; }
  .action-btn { padding: 10px 16px; font-size: 0.8rem; }
}
@media (max-width: 480px) {
  .big-fifa-card { padding: 24px 20px; }
  .big-fifa-rating-num { font-size: 2.5rem; }
  .big-fifa-photo-wrap { width: 110px; height: 110px; }
  .big-fifa-name { font-size: 1.3rem; }
  .big-fifa-stats { gap: 8px 16px; }
  .big-fifa-stat { font-size: 0.78rem; }
  .big-fifa-stat-val { font-size: 1rem; }
  .action-btn { flex: 1; min-width: 130px; }
  .detailed-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div id="loader">
  <img src="logo.png" alt="Vinlandx" class="loader-logo" onerror="this.style.display='none'" />
  <div class="loader-text">VINLANDX</div>
  <div class="loader-bar"></div>
</div>

<div class="bg-layer" id="bgLayer" style="background-image: url('background2.png');"></div>
<div class="bg-overlay"></div>

<header id="header">
  <a href="index.html" class="header-logo">
    <img src="logo.png" alt="Vinlandx" onerror="this.style.display='none'" />
    <div class="header-logo-text">
      <span class="main">كرة الحومة - Vinlandx</span>
      <span class="sub">منصة كرة القدم الجزائرية</span>
    </div>
  </a>

  <nav id="nav">
    <a href="index.html">الرئيسية</a>
    <a href="players.html" class="active">اللاعبين</a>
    <a href="matches.html">الماتشات</a>
    <a href="leaderboard.html">الترتيب</a>
    <a href="compare.html">قارن</a>
    <a href="teams.html">الفرق</a>
  </nav>

  <div class="header-actions">
    <button class="icon-btn mobile-toggle" onclick="toggleMobileNav()" aria-label="القائمة">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="الوضع">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div id="userArea">
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container" id="content">
    <div class="empty">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <h2>جاري التحميل...</h2>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://dhvuopnibiwpzuwvxxtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sl9It4cgGFwkGCC76X4zHw_Hjx4iELO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let player = null;
let playerEvents = [];
let playerAchievements = [];

const params = new URLSearchParams(window.location.search);
const playerId = params.get("id");

window.addEventListener("load", () => {
  document.getElementById("loader").classList.add("hidden");
});

function getSavedTheme() { return localStorage.getItem("vinlandx_theme") || "dark"; }
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("themeIcon");
  if (theme === "dark") {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function toggleTheme() {
  const current = getSavedTheme();
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("vinlandx_theme", next);
  applyTheme(next);
  showToast(next === "dark" ? "🌙 الوضع الداكن" : "☀️ الوضع الفاتح", "success");
}
applyTheme(getSavedTheme());

function toggleMobileNav() { document.getElementById("nav").classList.toggle("open"); }

window.addEventListener("scroll", () => {
  const header = document.getElementById("header");
  if (window.scrollY > 50) header.classList.add("scrolled");
  else header.classList.remove("scrolled");
});

// AUTH
async function signInWithGoogle() {
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://vinlandx.github.io" }
    });
    if (error) throw error;
  } catch (err) {
    showToast("خطأ: " + err.message, "error");
  }
}

async function signOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  renderUserArea();
  showToast("تسجّل الخروج", "success");
}

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  }
  renderUserArea();
}

supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  } else {
    currentUser = null;
    currentProfile = null;
  }
  renderUserArea();
});

function renderUserArea() {
  const area = document.getElementById("userArea");
  if (currentUser) {
    const avatar =
      currentProfile?.avatar_url ||
      currentUser?.user_metadata?.avatar_url ||
      currentUser?.user_metadata?.picture ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(currentProfile?.full_name || currentUser?.email || "لاعب")}&background=22c55e&color=fff&bold=true`;

    const name =
      currentProfile?.full_name ||
      currentUser?.user_metadata?.full_name ||
      currentUser?.user_metadata?.name ||
      currentUser?.email?.split("@")[0] ||
      "لاعب";

    area.innerHTML = `
      <button class="user-btn" onclick="if(confirm('تسجّل الخروج؟')) signOut()" title="${escapeHTML(name)}">
        <img src="${avatar}" alt="${escapeHTML(name)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=22c55e&color=fff'" />
        <span>${escapeHTML(name)}</span>
      </button>
    `;
  } else {
    area.innerHTML = `
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    `;
  }
}

// Helpers
function escapeHTML(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}

function getCardTier(o) {
  if (o >= 85) return "gold";
  if (o >= 70) return "silver";
  return "bronze";
}

function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23334"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="%2322c55e" stroke-width="1.5"/></svg>';
}

function statColor(v) {
  if (v >= 85) return "green";
  if (v >= 70) return "gold";
  if (v >= 55) return "blue";
  return "red";
}

async function fetchSafe(table, query = "") {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

let toastTimer;
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  clearTimeout(toastTimer);
  setTimeout(() => t.classList.add("show"), 10);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

// Load Player
async function loadPlayer() {
  const content = document.getElementById("content");

  if (!playerId) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <h2>ما فيه لاعب محدد</h2>
        <p>اختار لاعب من صفحة اللاعبين</p>
        <a href="players.html" class="action-btn green">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          شوف اللاعبين
        </a>
      </div>
    `;
    return;
  }

  try {
    const [players, events, achievements] = await Promise.all([
      fetchSafe("players", `id=eq.${playerId}&select=*`),
      fetchSafe("events", `player_id=eq.${playerId}&select=*`),
      fetchSafe("achievements", `player_id=eq.${playerId}&select=*`)
    ]);

    if (!players || players.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <h2>ما لقيناش اللاعب</h2>
          <p>يمكن تحيّد ولا الرابط غالط</p>
          <a href="players.html" class="action-btn green">شوف اللاعبين</a>
        </div>
      `;
      return;
    }

    player = players[0];
    playerEvents = events || [];
    playerAchievements = achievements || [];

    renderPlayer();
  } catch (e) {
    content.innerHTML = `<div class="empty"><h2>خطأ في التحميل</h2><p>${e.message}</p></div>`;
  }
}

function renderPlayer() {
  const content = document.getElementById("content");
  const overall = calcOverall(player);
  const tier = getCardTier(overall);
  const photo = player.photo || defaultPhoto();

  // حساب الإحصائيات
  const goals = playerEvents.filter(e => e.event_type === "goal").length;
  const assists = playerEvents.filter(e => e.event_type === "assist").length;
  const motm = playerEvents.filter(e => e.event_type === "motm").length;
  const yellow = playerEvents.filter(e => e.event_type === "yellow").length;
  const red = playerEvents.filter(e => e.event_type === "red").length;
  const ratings = playerEvents.filter(e => e.event_type === "rating").map(e => e.rating);
  const avgRating = ratings.length > 0 ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : "-";
  const points = goals * 3 + assists * 2 + motm * 5 - yellow - red * 3;

  // الإحصائيات التفصيلية
  const statsList = [
    { key: "pace", label: "السرعة", val: player.pace || 0 },
    { key: "shot_power", label: "قوة الفراب", val: player.shot_power || 0 },
    { key: "passing", label: "التمرير", val: player.passing || 0 },
    { key: "dribbling", label: "المراوغة", val: player.dribbling || 0 },
    { key: "defense", label: "الدفاع", val: player.defense || 0 },
    { key: "strength", label: "القوة البدنية", val: player.strength || 0 }
  ];

  const statsBarsHTML = statsList.map(s => `
    <div class="stat-bar-row">
      <div class="stat-bar-header">
        <span class="stat-bar-header-label">${s.label}</span>
        <span class="stat-bar-header-val">${s.val}</span>
      </div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill ${statColor(s.val)}" style="width:${s.val}%"></div>
      </div>
    </div>
  `).join("");

  const achievementsHTML = playerAchievements.length > 0 ? `
    <div class="achievements-list">
      ${playerAchievements.map(a => `
        <div class="achievement-badge">
          <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          ${escapeHTML(a.title)}
        </div>
      `).join("")}
    </div>
  ` : `
    <p style="color:var(--text-muted);font-size:0.85rem;font-weight:600">ما زال ما عندو إنجازات</p>
  `;

  document.title = `${player.name} - Vinlandx`;

  content.innerHTML = `
    <div class="player-scene">
      <!-- BIG FIFA CARD -->
      <div class="big-fifa-card ${tier}" id="bigCard">
        <div class="big-fifa-rating">
          <span class="big-fifa-rating-num">${overall}</span>
          <span class="big-fifa-position">${player.position}</span>
        </div>
        <div class="big-fifa-photo-wrap">
          <img class="big-fifa-photo" src="${photo}" alt="${escapeHTML(player.name)}" onerror="this.src='${defaultPhoto()}'" crossorigin="anonymous" />
        </div>
        <div class="big-fifa-name">${escapeHTML(player.name)}</div>
        <div class="big-fifa-stats">
          ${statsList.map(s => `
            <div class="big-fifa-stat">
              <span class="big-fifa-stat-val">${s.val}</span>
              <span class="big-fifa-stat-label">${s.label}</span>
            </div>
          `).join("")}
        </div>
      </div>

      <!-- PLAYER INFO -->
      <div class="player-info-section glass">
        <h1 class="player-name-header">
          <span class="green">${escapeHTML(player.name)}</span>
        </h1>
        <div class="player-meta">
          <span class="meta-tag green">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            ${player.position}
          </span>
          <span class="meta-tag gold">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            ${points} نقطة
          </span>
          ${avgRating !== "-" ? `
            <span class="meta-tag blue">
              <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
              ${avgRating} / 10
            </span>
          ` : ''}
        </div>

        <!-- Quick stats -->
        <div class="detailed-stats">
          <div class="stat-box">
            <div class="stat-box-val">${goals}</div>
            <div class="stat-box-lbl">أهداف</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-val">${assists}</div>
            <div class="stat-box-lbl">تمريرات</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-val">${motm}</div>
            <div class="stat-box-lbl">رجل الماتش</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-val">${yellow + red}</div>
            <div class="stat-box-lbl">بطاقات</div>
          </div>
        </div>

        <!-- Progress bars -->
        <div class="stats-bars">
          ${statsBarsHTML}
        </div>

        <!-- Achievements -->
        <h3 style="font-size:1rem;font-weight:800;margin-bottom:12px;color:var(--text)">🏅 الإنجازات</h3>
        ${achievementsHTML}

        <!-- Actions -->
        <div class="player-actions">
          <button class="action-btn gold" onclick="downloadCard()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            حمّل البطاقة
          </button>
          <button class="action-btn whatsapp" onclick="shareWhatsApp()">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            شارك على واتساب
          </button>
          <a href="compare.html" class="action-btn outline">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>
            قارن مع لاعب
          </a>
          <a href="players.html" class="action-btn outline">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            رجوع
          </a>
        </div>
      </div>
    </div>
  `;
}

// Download Card
async function downloadCard() {
  try {
    const card = document.getElementById("bigCard");
    if (!card) return;

    showToast("جاري تحميل البطاقة...", "success");

    const originalTransform = card.style.transform;
    card.style.transform = "none";

    const canvas = await html2canvas(card, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      allowTaint: false,
      logging: false
    });

    card.style.transform = originalTransform;

    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `vinlandx-${player.name}.png`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("✅ تحمّلت البطاقة", "success");
    }, "image/png");
  } catch (e) {
    showToast("خطأ: " + e.message, "error");
  }
}

// Share WhatsApp
function shareWhatsApp() {
  const url = window.location.href;
  const text = `🔥 شوف بطاقة ${player.name} في كرة الحومة 🇩🇿\n${url}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
}

// Init
document.addEventListener("DOMContentLoaded", async () => {
  await checkAuth();
  await loadPlayer();
});
</script>

</body>
</html>
