<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0f1a" />
<title>اللاعبين - Vinlandx</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="manifest" href="manifest.json" />
  <script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-1: #4ade80; --green-2: #22c55e; --green-3: #16a34a; --green-4: #15803d;
  --red-1: #f87171; --red-2: #ef4444; --red-3: #dc2626;
  --gold-1: #fde68a; --gold-2: #fbbf24; --gold-3: #f59e0b; --gold-4: #d97706;
  --blue-2: #60a5fa; --blue-3: #3b82f6;

  --bg: #070b14;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.09);
  --text: #f1f5f9; --text-muted: #94a3b8;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);

  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;

  --grad-green: linear-gradient(135deg, var(--green-1) 0%, var(--green-3) 100%);
  --grad-red: linear-gradient(135deg, var(--red-1) 0%, var(--red-3) 100%);
  --grad-gold: linear-gradient(135deg, var(--gold-2) 0%, var(--gold-4) 100%);
  --grad-mixed: linear-gradient(135deg, var(--green-2) 0%, var(--gold-2) 50%, var(--red-2) 100%);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255,255,255,0.9);
  --card-hover: rgba(255,255,255,1);
  --text: #0f172a; --text-muted: #475569;
  --border: rgba(15,23,42,0.08); --border-strong: rgba(15,23,42,0.15);
}

html { scroll-behavior: smooth; }
html, body { height: 100%; overflow-x: hidden; }

body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text); background: var(--bg);
  min-height: 100vh; direction: rtl;
  position: relative;
  transition: background 0.3s ease, color 0.3s ease;
}

/* LOADER */
#loader {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 10000; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
.loader-logo { width: 100px; height: 100px; margin-bottom: 16px; object-fit: contain; }
.loader-text { font-size: 1.4rem; font-weight: 900; color: var(--green-1); letter-spacing: 2px; margin-bottom: 20px; }
.loader-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
.loader-bar::after { content: ""; position: absolute; inset: 0; background: var(--grad-green); animation: loaderBar 1.2s ease-in-out infinite; }
@keyframes loaderBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* BACKGROUND */
.bg-layer {
  position: fixed; inset: 0; z-index: -2;
  background-size: cover; background-position: center;
  background-attachment: fixed;
}
.bg-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(7,11,20,0.8) 0%, rgba(7,11,20,0.95) 100%);
}
[data-theme="light"] .bg-overlay {
  background: linear-gradient(180deg, rgba(248,250,252,0.9) 0%, rgba(248,250,252,0.98) 100%);
}

.glass {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

.container { max-width: 1300px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* HEADER */
header {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 1300px; z-index: 100;
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: all 0.3s;
  background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
header.scrolled { top: 6px; padding: 6px 14px; }

.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.header-logo img { height: 40px; width: auto; object-fit: contain; }
.header-logo-text { display: flex; flex-direction: column; line-height: 1; }
.header-logo-text .main { font-size: 1rem; font-weight: 900; color: var(--green-1); letter-spacing: 0.5px; }
.header-logo-text .sub { font-size: 0.62rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 4px; }
nav a {
  padding: 7px 12px; color: var(--text-muted); text-decoration: none;
  font-weight: 700; font-size: 0.82rem; border-radius: var(--radius-sm);
  transition: all 0.2s;
}
nav a:hover { color: var(--text); background: rgba(34,197,94,0.1); }
nav a.active { color: var(--green-1); background: rgba(34,197,94,0.15); }

.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; padding: 0;
}
.icon-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 4px; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s; font-family: inherit; color: var(--text);
}
.user-btn:hover { background: rgba(34,197,94,0.15); border-color: var(--green-2); }
.user-btn img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--green-2); object-fit: cover; }
.user-btn span { font-size: 0.82rem; font-weight: 700; }

.login-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  background: var(--grad-green); border: none; color: #fff;
  font-family: inherit; font-weight: 800; font-size: 0.82rem;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}
.login-btn:hover { transform: translateY(-1px); }
.login-btn svg { width: 16px; height: 16px; fill: #fff; }

.mobile-toggle { display: none; }

@media (max-width: 900px) {
  nav {
    display: none; position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    flex-direction: column; padding: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  nav.open { display: flex; }
  nav a { width: 100%; text-align: right; padding: 10px 14px; }
  .mobile-toggle { display: flex; }
  .user-btn span { display: none; }
}

main { padding-top: 90px; padding-bottom: 60px; min-height: 100vh; }

/* PAGE HEADER */
.page-header {
  text-align: center;
  padding: 30px 0 20px;
}
.page-header h1 {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 900;
  margin-bottom: 10px;
}
.page-header h1 .green {
  background: var(--grad-green);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.page-header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

/* FILTERS BAR */
.filters-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: space-between;
  padding: 14px 18px;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 380px;
}
.search-box svg {
  position: absolute;
  top: 50%;
  right: 14px;
  transform: translateY(-50%);
  width: 18px; height: 18px;
  stroke: var(--text-muted); fill: none;
  stroke-width: 2.2; pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 10px 40px 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  outline: none;
  transition: all 0.2s;
}
[data-theme="light"] .search-input { background: #fff; }
.search-input:focus {
  border-color: var(--green-2);
  box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
}
.search-input::placeholder { color: var(--text-muted); }

.position-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pos-tab {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  color: var(--text-muted);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}
[data-theme="light"] .pos-tab { background: #fff; }
.pos-tab:hover { border-color: var(--green-2); color: var(--text); }
.pos-tab.active {
  background: var(--grad-green);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
}

.sort-select {
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  outline: none;
  transition: all 0.2s;
}
[data-theme="light"] .sort-select { background: #fff; }
.sort-select:focus { border-color: var(--green-2); }

.results-count {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 18px;
}
.results-count strong {
  color: var(--green-1);
  font-weight: 900;
}

/* PLAYERS GRID */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

/* FIFA CARD 3D */
.fifa-card {
  position: relative;
  border-radius: 18px;
  padding: 20px 18px;
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.5s cubic-bezier(.4,0,.2,1);
  transform-style: preserve-3d;
  perspective: 1000px;
  animation: cardIn 0.4s ease backwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
.fifa-card.gold {
  background: linear-gradient(160deg, #fef9c3 0%, #fde68a 20%, #fbbf24 50%, #d97706 85%, #92400e 100%);
  box-shadow: 0 20px 60px rgba(217,119,6,0.4), inset 0 0 0 2px rgba(255,255,255,0.5);
}
.fifa-card.silver {
  background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 55%, #94a3b8 85%, #64748b 100%);
  box-shadow: 0 20px 60px rgba(100,116,139,0.4), inset 0 0 0 2px rgba(255,255,255,0.6);
}
.fifa-card.bronze {
  background: linear-gradient(160deg, #fed7aa 0%, #fb923c 25%, #ea580c 55%, #c2410c 85%, #7c2d12 100%);
  box-shadow: 0 20px 60px rgba(194,65,12,0.4), inset 0 0 0 2px rgba(255,255,255,0.4);
}
.fifa-card::before {
  content: "";
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.8s;
  pointer-events: none;
}
.fifa-card:hover::before { transform: translateX(100%); }
.fifa-card:hover { transform: translateY(-12px) rotateY(6deg) rotateX(-4deg) scale(1.03); }

.fifa-rating {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-bottom: 14px;
  position: relative; z-index: 1;
}
.fifa-rating-num {
  font-size: 2.6rem; font-weight: 900; line-height: 1;
  color: #422006; text-shadow: 0 2px 4px rgba(255,255,255,0.5);
}
.fifa-card.silver .fifa-rating-num { color: #1e293b; text-shadow: 0 2px 4px rgba(255,255,255,0.7); }
.fifa-card.bronze .fifa-rating-num { color: #431407; text-shadow: 0 2px 4px rgba(255,255,255,0.3); }

.fifa-position {
  padding: 4px 10px; border-radius: 8px;
  font-size: 0.68rem; font-weight: 900; letter-spacing: 1px;
  background: rgba(66,32,6,0.9); color: #fef3c7;
}
.fifa-card.silver .fifa-position { background: rgba(30,41,59,0.9); color: #f1f5f9; }
.fifa-card.bronze .fifa-position { background: rgba(67,20,7,0.9); color: #fed7aa; }

.fifa-photo-wrap {
  width: 90px; height: 90px;
  margin: 0 auto 14px;
  position: relative; z-index: 1;
}
.fifa-photo {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover;
  border: 4px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  background: #f1f5f9;
}
.fifa-photo-wrap::after {
  content: "";
  position: absolute; inset: -8px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
  z-index: -1;
  animation: pulseGlow 2.5s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%,100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.1); }
}
.fifa-name {
  font-size: 1.05rem; font-weight: 900; margin-bottom: 10px;
  color: #422006; text-shadow: 0 2px 4px rgba(255,255,255,0.5);
  position: relative; z-index: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fifa-card.silver .fifa-name { color: #1e293b; }
.fifa-card.bronze .fifa-name { color: #431407; }

.fifa-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 5px 14px; padding-top: 10px;
  border-top: 2px solid rgba(0,0,0,0.15);
  position: relative; z-index: 1;
}
.fifa-stat {
  display: flex; align-items: baseline; gap: 5px;
  font-size: 0.68rem; font-weight: 800; color: #422006;
}
.fifa-card.silver .fifa-stat { color: #1e293b; }
.fifa-card.bronze .fifa-stat { color: #431407; }
.fifa-stat-val { font-size: 0.95rem; font-weight: 900; }

/* POINTS BADGE */
.points-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  color: #fff;
  font-weight: 900;
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 2;
  border: 1px solid rgba(255,255,255,0.2);
}
.points-badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }

/* EMPTY */
.empty {
  text-align: center; padding: 70px 20px;
  grid-column: 1 / -1;
  color: var(--text-muted); font-weight: 600;
}
.empty svg {
  width: 70px; height: 70px;
  stroke: var(--green-2); fill: none; stroke-width: 1.2;
  margin-bottom: 16px; opacity: 0.5;
}
.empty h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 6px; }
.empty p { font-size: 0.9rem; }

/* SKELETON */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
  background-size: 200% 100%;
  animation: skeleton 1.5s linear infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-card { height: 300px; border-radius: 18px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(120px);
  padding: 12px 20px; border-radius: var(--radius-md);
  background: var(--bg); border: 1px solid var(--border-strong);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  font-weight: 700; font-size: 0.85rem; z-index: 500;
  transition: transform 0.3s ease;
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green-2); color: var(--green-1); }
.toast.error { border-color: var(--red-2); color: var(--red-1); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--green-3); border-radius: 999px; }

@media (max-width: 768px) {
  .container { padding: 0 16px; }
  main { padding-top: 80px; }
  .page-header { padding: 20px 0 16px; }
  .filters-bar { padding: 12px 14px; gap: 10px; }
  .search-box { max-width: 100%; }
  .players-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .fifa-card { padding: 16px 14px; }
  .fifa-rating-num { font-size: 2rem; }
  .fifa-photo-wrap { width: 75px; height: 75px; }
  .fifa-name { font-size: 0.95rem; }
}
@media (max-width: 480px) {
  .players-grid { grid-template-columns: repeat(2, 1fr); }
  .page-header h1 { font-size: 1.5rem; }
  .pos-tab { padding: 6px 10px; font-size: 0.75rem; }
  .fifa-card { padding: 12px 10px; border-radius: 14px; }
  .fifa-rating-num { font-size: 1.7rem; }
  .fifa-photo-wrap { width: 65px; height: 65px; }
  .fifa-name { font-size: 0.85rem; margin-bottom: 8px; }
  .fifa-stats { gap: 4px 10px; }
  .fifa-stat { font-size: 0.62rem; }
  .fifa-stat-val { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div id="loader">
  <img src="logo.png" alt="Vinlandx" class="loader-logo" onerror="this.style.display='none'" />
  <div class="loader-text">VINLANDX</div>
  <div class="loader-bar"></div>
</div>

<div class="bg-layer" id="bgLayer" style="background-image: url('background2.png');"></div>
<div class="bg-overlay"></div>

<header id="header">
  <a href="index.html" class="header-logo">
    <img src="logo.png" alt="Vinlandx" onerror="this.style.display='none'" />
    <div class="header-logo-text">
      <span class="main">كرة الحومة - Vinlandx</span>
      <span class="sub">منصة كرة القدم الجزائرية</span>
    </div>
  </a>

  <nav id="nav">
    <a href="index.html">الرئيسية</a>
    <a href="players.html" class="active">اللاعبين</a>
    <a href="matches.html">الماتشات</a>
    <a href="leaderboard.html">الترتيب</a>
    <a href="compare.html">قارن</a>
    <a href="teams.html">الفرق</a>
  </nav>

  <div class="header-actions">
    <button class="icon-btn mobile-toggle" onclick="toggleMobileNav()" aria-label="القائمة">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="الوضع">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div id="userArea">
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <div class="page-header">
      <h1>
        لاعبين <span class="green">الحومة</span>
      </h1>
      <p>كل نجوم الحومة في مكان واحد ⚽</p>
    </div>

    <div class="filters-bar glass">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="قلّب على لاعب..." oninput="applyFilters()" />
      </div>

      <div class="position-tabs" id="positionTabs">
        <button class="pos-tab active" onclick="setPosition('all', this)">الكل</button>
        <button class="pos-tab" onclick="setPosition('حارس', this)">حراس</button>
        <button class="pos-tab" onclick="setPosition('مدافع', this)">مدافعين</button>
        <button class="pos-tab" onclick="setPosition('وسط', this)">وسط</button>
        <button class="pos-tab" onclick="setPosition('مهاجم', this)">مهاجمين</button>
      </div>

      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="overall">الأعلى تقييم</option>
        <option value="name">الاسم (أ-ي)</option>
        <option value="points">النقاط</option>
        <option value="goals">الأهداف</option>
        <option value="pace">السرعة</option>
        <option value="shot">قوة الفراب</option>
        <option value="passing">التمرير</option>
        <option value="defense">الدفاع</option>
      </select>
    </div>

    <div class="results-count" id="resultsCount"></div>

    <div class="players-grid" id="playersGrid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://dhvuopnibiwpzuwvxxtv.supabase.co";
const SUPABASE_KEY = "sb_publishable_sl9It4cgGFwkGCC76X4zHw_Hjx4iELO";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let allPlayers = [];
let allEvents = [];
let currentPosition = "all";

window.addEventListener("load", () => {
  document.getElementById("loader").classList.add("hidden");
});

function getSavedTheme() { return localStorage.getItem("vinlandx_theme") || "dark"; }
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.getElementById("themeIcon");
  if (theme === "dark") {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function toggleTheme() {
  const current = getSavedTheme();
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("vinlandx_theme", next);
  applyTheme(next);
  showToast(next === "dark" ? "🌙 الوضع الداكن" : "☀️ الوضع الفاتح", "success");
}
applyTheme(getSavedTheme());

function toggleMobileNav() { document.getElementById("nav").classList.toggle("open"); }

window.addEventListener("scroll", () => {
  const header = document.getElementById("header");
  if (window.scrollY > 50) header.classList.add("scrolled");
  else header.classList.remove("scrolled");
});

// AUTH
async function signInWithGoogle() {
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://vinlandx.github.io" }
    });
    if (error) throw error;
  } catch (err) {
    showToast("خطأ في تسجيل الدخول: " + err.message, "error");
  }
}

async function signOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  renderUserArea();
  showToast("تسجّل الخروج", "success");
}

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  }
  renderUserArea();
}

supabaseClient.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).single();
    currentProfile = profile;
  } else {
    currentUser = null;
    currentProfile = null;
  }
  renderUserArea();
});

function renderUserArea() {
  const area = document.getElementById("userArea");
  if (currentUser) {
    const avatar =
      currentProfile?.avatar_url ||
      currentUser?.user_metadata?.avatar_url ||
      currentUser?.user_metadata?.picture ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(currentProfile?.full_name || currentUser?.email || "لاعب")}&background=22c55e&color=fff&bold=true`;

    const name =
      currentProfile?.full_name ||
      currentUser?.user_metadata?.full_name ||
      currentUser?.user_metadata?.name ||
      currentUser?.email?.split("@")[0] ||
      "لاعب";

    area.innerHTML = `
      <button class="user-btn" onclick="if(confirm('تسجّل الخروج؟')) signOut()" title="${escapeHTML(name)}">
        <img src="${avatar}" alt="${escapeHTML(name)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=22c55e&color=fff'" />
        <span>${escapeHTML(name)}</span>
      </button>
    `;
  } else {
    area.innerHTML = `
      <button class="login-btn" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        دخول
      </button>
    `;
  }
}

// Helpers
function escapeHTML(s) {
  if (!s) return "";
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}
function getCardTier(o) {
  if (o >= 85) return "gold";
  if (o >= 70) return "silver";
  return "bronze";
}
function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23334"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="%2322c55e" stroke-width="1.5"/></svg>';
}
function playerStats(pid) {
  const ev = allEvents.filter(e => e.player_id === pid);
  const goals = ev.filter(e => e.event_type === "goal").length;
  const assists = ev.filter(e => e.event_type === "assist").length;
  const motm = ev.filter(e => e.event_type === "motm").length;
  const yellow = ev.filter(e => e.event_type === "yellow").length;
  const red = ev.filter(e => e.event_type === "red").length;
  const points = goals * 3 + assists * 2 + motm * 5 - yellow - red * 3;
  return { goals, assists, motm, points };
}
async function fetchSafe(table, query = "") {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

let toastTimer;
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  clearTimeout(toastTimer);
  setTimeout(() => t.classList.add("show"), 10);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

// FILTERS
function setPosition(pos, btn) {
  currentPosition = pos;
  document.querySelectorAll(".pos-tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const sortBy = document.getElementById("sortSelect").value;

  let filtered = [...allPlayers];

  if (currentPosition !== "all") {
    filtered = filtered.filter(p => p.position === currentPosition);
  }

  if (search) {
    filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
  }

  filtered.sort((a, b) => {
    if (sortBy === "overall") return calcOverall(b) - calcOverall(a);
    if (sortBy === "name") return a.name.localeCompare(b.name, "ar");
    if (sortBy === "points") return playerStats(b.id).points - playerStats(a.id).points;
    if (sortBy === "goals") return playerStats(b.id).goals - playerStats(a.id).goals;
    if (sortBy === "pace") return (b.pace || 0) - (a.pace || 0);
    if (sortBy === "shot") return (b.shot_power || 0) - (a.shot_power || 0);
    if (sortBy === "passing") return (b.passing || 0) - (a.passing || 0);
    if (sortBy === "defense") return (b.defense || 0) - (a.defense || 0);
    return 0;
  });

  renderPlayers(filtered);
}

function renderPlayers(players) {
  const grid = document.getElementById("playersGrid");
  const count = document.getElementById("resultsCount");

  count.innerHTML = `لقينالك <strong>${players.length}</strong> لاعب${players.length !== 1 ? 'ين' : ''}`;

  if (players.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>ما لقيناش لاعبين</h3>
        <p>جرّب فلتر آخر ولا امسح البحث</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = players.map((p, i) => {
    const overall = calcOverall(p);
    const tier = getCardTier(overall);
    const photo = p.photo || defaultPhoto();
    const stats = playerStats(p.id);

    return `
      <div class="fifa-card ${tier}" style="animation-delay: ${i * 0.03}s" onclick="location.href='player.html?id=${p.id}'">
        ${stats.points > 0 ? `
          <div class="points-badge">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            ${stats.points}
          </div>
        ` : ''}
        <div class="fifa-rating">
          <span class="fifa-rating-num">${overall}</span>
          <span class="fifa-position">${p.position}</span>
        </div>
        <div class="fifa-photo-wrap">
          <img class="fifa-photo" src="${photo}" alt="${escapeHTML(p.name)}" onerror="this.src='${defaultPhoto()}'" />
        </div>
        <div class="fifa-name">${escapeHTML(p.name)}</div>
        <div class="fifa-stats">
          <div class="fifa-stat"><span class="fifa-stat-val">${p.pace||0}</span> سرعة</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.shot_power||0}</span> فراب</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.passing||0}</span> تمرير</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.dribbling||0}</span> مراوغة</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.defense||0}</span> دفاع</div>
          <div class="fifa-stat"><span class="fifa-stat-val">${p.strength||0}</span> قوة</div>
        </div>
      </div>
    `;
  }).join("");
}

// LOAD
async function loadAll() {
  try {
    const [players, events] = await Promise.all([
      fetchSafe("players", "select=*&order=created_at.desc"),
      fetchSafe("events", "select=player_id,event_type")
    ]);
    allPlayers = players;
    allEvents = events;
    applyFilters();
  } catch (e) {
    console.error(e);
    document.getElementById("playersGrid").innerHTML = `<div class="empty"><h3>خطأ في التحميل</h3></div>`;
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  await checkAuth();
  await loadAll();
});
</script>

</body>
</html>
